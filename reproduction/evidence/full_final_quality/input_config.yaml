data:
  dataset_type: ncd
  dataset_path: /mnt/d/github/LiDAR-GS-SLAM-fresh/build/datasets/ncd_quad_easy
  min_depth: 0.5
  max_depth: 120
  cloud_reader:
    cloud_format: rosbag
    rosbag_topic: /os_cloud_node/points
  trajectory_reader:
    reader_type: tum
    filename: /mnt/d/github/LiDAR-GS-SLAM-fresh/build/datasets/ncd_quad_easy/gt-nc-quad-easy.csv
    timestamp_dtol: 20
    gt_T_sensor_t_xyz_q_xyzw:
    - 0.001
    - 0
    - 0.091
    - 0
    - 0
    - 0
    - 1
slam:
  keyframe_th: 0.6
  knn_maxd: 99999.0
  max_correspondence_distance: 1.0
  overlapped_th: 0.16
  overlapped_th2: 0.16
  trackable_opacity_th: 0.01
  downsample_rate: 10
  keyframe_freq: 30
  n_trackable_keyframes: 100
  use_dynamic_fov: false
  densify_threshold_opacity: 0.2
  densify_percentage: 0.4
  opt_scaling_max: 0.1
  use_densify: true
  use_plane_management: true
  densify_start_iteration: 100
  pruning_min_opacity: 0.05
  pruning_min_scale: 0.001
  opt_lambda_dist: 0.01
  decay_speed: 0.02
  loop_constraint_noise: 1e-6
  loop_cooldown_time: 50.0
  downsample_voxel_size: 0.4
  loop_overlap_th: 0.7
  W: 1024
  H: 128
  fov_x_deg: 360
  fov_y_deg: 90
  depth_scale: 1.0
  depth_trunc: 120.0
output_path: /mnt/d/github/catkin_ws/src/real_recon/artifacts/gs_map/lidargs_repair_20261010/runs/full_final_quality
verbose: false
